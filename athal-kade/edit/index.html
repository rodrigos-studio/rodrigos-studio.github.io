<!doctype html>
<html lang="si">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0A7F7B">
<title>Menu edit · Athal Kade</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,500..900&family=Noto+Sans+Sinhala:wght@500;700&display=swap">
<style>
:root{--bg:#F3F5F4;--card:#FFFFFF;--ink:#1D1A16;--muted:#5F6B68;--line:#DDE3E1;--brand:#0A7F7B;--brand-ink:#FFFFFF;--soft:#E6F2F1;--warn:#C93A27;--ok:#1E8A4C;--yellow:#F4B52C;
  --f:"Archivo","Noto Sans Sinhala",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;--si:"Noto Sans Sinhala","Archivo",sans-serif;color-scheme:light}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f);font-size:16px;line-height:1.45;padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
button,input,textarea{font:inherit;color:inherit}
.wrap{max-width:640px;margin:0 auto;padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px))}
.si{font-family:var(--si)}
[hidden]{display:none!important}
.demo{background:#FFF4D6;border-bottom:1px solid #F0D58A;font-family:var(--si);font-size:14px;padding:8px 0;text-align:center}
.demo b{font-family:var(--f)}
/* login */
.login{min-height:80vh;display:grid;place-items:center;padding:30px 0}
.login .box{width:100%;max-width:360px;background:var(--card);border:1px solid var(--line);border-radius:22px;padding:28px 22px;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.06)}
.login h1{margin:6px 0 2px;font-size:26px;font-weight:900;font-stretch:110%}
.login p{margin:0 0 18px;color:var(--muted);font-family:var(--si)}
.pin{width:100%;font-size:34px;letter-spacing:.5em;text-align:center;padding:12px 0 12px .5em;border:2px solid var(--line);border-radius:14px;background:var(--bg);font-weight:800}
.pin:focus{outline:none;border-color:var(--brand)}
.err{color:var(--warn);font-family:var(--si);font-weight:700;min-height:24px;margin-top:8px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:10px 18px;border-radius:14px;border:0;font-weight:800;cursor:pointer;text-decoration:none}
.btn.main{background:var(--brand);color:var(--brand-ink)}
.btn.line{background:var(--card);border:2px solid var(--line);color:var(--ink)}
.btn.full{width:100%;margin-top:12px;font-size:18px}
/* top bar */
.top{position:sticky;top:0;z-index:10;background:rgba(243,245,244,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:58px}
.top b{font-size:18px;font-weight:900;font-stretch:110%}
.top small{display:block;color:var(--muted);font-weight:600;font-size:12px}
.top a{font-weight:800;color:var(--brand);text-decoration:none;font-size:15px;white-space:nowrap}
.chips{display:flex;gap:8px;overflow-x:auto;padding:10px 0 12px;scrollbar-width:none}
.chips a{flex:none;text-decoration:none;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:999px;padding:7px 14px;font-weight:800;font-size:14px}
/* categories and items */
main{padding-bottom:120px}
.cat{margin-top:18px;scroll-margin-top:120px}
.cat-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:0 2px 8px}
.cat-h h2{margin:0;font-size:22px;font-weight:900}
.cat-h h2 span{font-family:var(--si);font-size:15px;color:var(--muted);font-weight:700;margin-left:6px}
.add-item{width:100%;min-height:52px;border:2px dashed var(--brand);background:var(--soft);color:var(--brand);border-radius:16px;font-weight:800;cursor:pointer;font-family:var(--si);font-size:16px;margin-top:4px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;margin-bottom:10px;overflow:hidden}
.card.bad{border-color:var(--warn);box-shadow:0 0 0 2px rgba(201,58,39,.15)}
.row{display:grid;grid-template-columns:76px minmax(0,1fr) 118px;gap:12px;align-items:center;padding:12px}
.ph{width:76px;height:76px;border-radius:14px;border:2px dashed var(--line);background:var(--bg);display:grid;place-items:center;overflow:hidden;cursor:pointer;padding:0;position:relative}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph span{font-family:var(--si);font-size:12px;font-weight:700;color:var(--muted);line-height:1.2;text-align:center;padding:0 4px}
.ph.busy::after{content:"…";position:absolute;inset:0;display:grid;place-items:center;background:rgba(255,255,255,.75);font-size:30px;font-weight:900}
.nm{min-width:0}
.nm b{display:block;font-size:17px;font-weight:800;overflow-wrap:anywhere}
.nm b.empty{color:var(--warn);font-family:var(--si)}
.nm span{display:block;font-family:var(--si);font-size:14px;color:var(--muted)}
.price{display:flex;align-items:center;border:2px solid var(--line);border-radius:12px;background:var(--bg);overflow:hidden}
.price:focus-within{border-color:var(--brand)}
.price i{font-style:normal;font-weight:800;color:var(--muted);padding-left:10px;font-size:14px}
.price input{width:100%;min-width:0;border:0;background:transparent;padding:12px 8px;font-size:18px;font-weight:800;text-align:right}
.price input:focus{outline:none}
.bar2{display:flex;align-items:center;gap:8px;padding:0 12px 12px;flex-wrap:wrap}
.tog{display:inline-flex;align-items:center;gap:8px;min-height:40px;border:2px solid var(--line);border-radius:999px;padding:4px 12px 4px 6px;background:var(--card);cursor:pointer;font-weight:800;font-size:14px;font-family:var(--si)}
.tog i{width:36px;height:22px;border-radius:999px;background:var(--line);position:relative;flex:none;transition:background .15s}
.tog i::after{content:"";position:absolute;left:3px;top:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:left .15s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.tog[aria-pressed="true"] i{background:var(--warn)}
.tog.pop[aria-pressed="true"] i{background:var(--yellow)}
.tog[aria-pressed="true"] i::after{left:17px}
.more{margin-left:auto;min-height:40px;border:0;background:transparent;color:var(--brand);font-weight:800;cursor:pointer;font-family:var(--si);font-size:14px}
.card.sold .ph,.card.sold .nm{opacity:.5}
.ed{border-top:1px solid var(--line);padding:12px;display:grid;gap:10px;background:#FAFBFB}
.ed label{display:grid;gap:4px;font-family:var(--si);font-size:13px;font-weight:700;color:var(--muted)}
.ed input,.ed textarea{width:100%;border:2px solid var(--line);border-radius:12px;padding:11px 12px;background:#fff;font-size:16px;font-weight:600;color:var(--ink)}
.ed input:focus,.ed textarea:focus{outline:none;border-color:var(--brand)}
.ed textarea{min-height:64px;resize:vertical}
.ed .acts{display:flex;gap:8px;flex-wrap:wrap}
.ed .acts button{min-height:44px;border-radius:12px;border:2px solid var(--line);background:#fff;font-weight:800;cursor:pointer;padding:0 14px;font-family:var(--si);font-size:14px}
.ed .acts .del{color:var(--warn);border-color:#F2C9C2;margin-left:auto}
.ed .sure{display:flex;align-items:center;gap:8px;font-family:var(--si);font-weight:700;color:var(--warn)}
.ed .sure button{min-height:44px;border-radius:12px;border:0;padding:0 16px;font-weight:800;cursor:pointer;font-family:var(--si)}
.ed .sure .yes{background:var(--warn);color:#fff}
.ed .sure .no{background:var(--line)}
.new-cat{margin-top:22px;display:flex;gap:8px}
.new-cat input{flex:1;min-width:0;border:2px solid var(--line);border-radius:14px;padding:12px;font-size:16px;background:#fff}
.foot{margin:26px 0 0;text-align:center;color:var(--muted);font-size:13px;font-family:var(--si)}
.foot button{background:none;border:0;color:var(--muted);text-decoration:underline;cursor:pointer;font-family:var(--si);font-size:13px}
/* save bar */
.save{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--card);border-top:1px solid var(--line);box-shadow:0 -8px 24px rgba(0,0,0,.06);padding-bottom:env(safe-area-inset-bottom,0px)}
.save .wrap{display:flex;align-items:center;gap:12px;min-height:72px}
.save p{margin:0;flex:1;font-family:var(--si);font-size:14px;font-weight:700;color:var(--muted);line-height:1.3}
.save p.dirty{color:var(--ink)}
.save p.done{color:var(--ok)}
.save p.bad{color:var(--warn)}
.save .btn{min-width:120px;font-size:17px}
.save .btn[disabled]{opacity:.45;cursor:default}
</style>
</head>
<body>
<div class="demo" id="demo" hidden><span class="wrap" style="display:block">Demo · PIN <b>1234</b> · මෙතන කරන වෙනස්කම් ඔයාගේ phone එකේ විතරයි</span></div>

<section class="login wrap" id="login">
  <form class="box" id="login-form" autocomplete="off">
    <div style="font-size:40px">🔐</div>
    <h1>Athal Kade</h1>
    <p>Menu එක වෙනස් කරන්න PIN එක දාන්න</p>
    <input class="pin" id="pin" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="6" aria-label="PIN" required>
    <div class="err" id="pin-err" role="alert"></div>
    <button class="btn main full" type="submit">ඇතුල් වෙන්න</button>
  </form>
</section>

<div id="app" hidden>
  <header class="top">
    <div class="wrap"><div><b>Athal Kade</b><small>Menu edit · Rodrigo's Studio</small></div><a href="../index.html" target="_blank" rel="noopener">Site එක බලන්න ↗</a></div>
    <nav class="wrap chips" id="chips" aria-label="Menu sections"></nav>
  </header>
  <main class="wrap" id="cats"></main>
  <div class="wrap">
    <form class="new-cat" id="new-cat"><input id="new-cat-name" placeholder="අලුත් කොටසක් (උදා: Drinks)" aria-label="New menu section name"><button class="btn line" type="submit">+ එකතු කරන්න</button></form>
    <p class="foot">Photo එකක් දාන්න photo කොටුව tap කරන්න. Website එකේ වෙනස් වෙන්නේ Save එබුවාම.<br><button type="button" id="reset" hidden>Demo menu එක මුල් විදියට ගන්න</button></p>
    <div style="height:110px"></div>
  </div>
  <div class="save"><div class="wrap"><p id="state">වෙනස්කම් නෑ</p><button class="btn main" id="save" type="button" disabled>Save</button></div></div>
</div>
<input type="file" id="file" accept="image/*" hidden>

<script src="../menu-data.js"></script>
<script>
(() => {
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
let menu = null, pin = "", dirty = 0, open = null, sure = null, photoFor = null;
const ss = { get: k => { try { return sessionStorage.getItem(k); } catch (e) { return null; } }, set: (k, v) => { try { sessionStorage.setItem(k, v); } catch (e) {} } };
$("#demo").hidden = !RSMenu.demo; $("#reset").hidden = !RSMenu.demo;

/* ---- PIN ---- */
async function enter(p) {
  if (!(await RSMenu.checkPin(p))) { $("#pin-err").textContent = "PIN එක වැරදියි. ආයෙත් බලන්න."; $("#pin").select(); return; }
  pin = p; ss.set("rs-edit-pin", p);
  menu = await RSMenu.load();
  $("#login").hidden = true; $("#app").hidden = false; render(); setState();
}
$("#login-form").addEventListener("submit", e => { e.preventDefault(); enter($("#pin").value.trim()); });
const kept = ss.get("rs-edit-pin"); if (kept) enter(kept); else $("#pin").focus();

/* ---- drawing ---- */
const findItem = id => { for (const c of menu.cats) { const i = c.items.findIndex(x => x.id === id); if (i >= 0) return { c, i, it: c.items[i] }; } return null; };
function cardHTML(it) {
  const bad = !it.n.trim() || !(it.p > 0);
  return `<article class="card${it.sold ? " sold" : ""}${bad && it._touched ? " bad" : ""}" data-id="${esc(it.id)}">
    <div class="row">
      <button class="ph" type="button" data-photo aria-label="${it.img ? "Photo එක මාරු කරන්න" : "Photo එකක් දාන්න"}">${it.img ? `<img src="${esc(it.img)}" alt="">` : `<span>📷<br>Photo දාන්න</span>`}</button>
      <div class="nm"><b class="${it.n.trim() ? "" : "empty"}">${it.n.trim() ? esc(it.n) : "නම දාන්න"}</b><span>${esc(it.si)}</span></div>
      <label class="price"><i>Rs</i><input type="text" inputmode="numeric" pattern="[0-9]*" value="${it.p || ""}" data-f="p" aria-label="${esc(it.n)} price"></label>
    </div>
    <div class="bar2">
      <button class="tog" type="button" data-tog="sold" aria-pressed="${!!it.sold}"><i></i>Sold out · ඉවරයි</button>
      <button class="tog pop" type="button" data-tog="tag" aria-pressed="${it.tag === "Popular"}"><i></i>Popular</button>
      <button class="more" type="button" data-more>${open === it.id ? "වහන්න ▲" : "වෙනස් කරන්න ▼"}</button>
    </div>
    ${open === it.id ? `<div class="ed">
      <label>කෑමේ නම (English)<input data-f="n" value="${esc(it.n)}" placeholder="උදා: Chicken kottu"></label>
      <label>සිංහල නම<input data-f="si" value="${esc(it.si)}" placeholder="උදා: චිකන් කොත්තු"></label>
      <label>විස්තරය<textarea data-f="d" placeholder="උදා: Chopped roti, chicken, egg and gravy">${esc(it.d)}</textarea></label>
      ${sure === it.id ? `<div class="sure">මේක මකන්නද? <button class="yes" type="button" data-del-yes>ඔව්, මකන්න</button><button class="no" type="button" data-del-no>නෑ</button></div>`
        : `<div class="acts"><button type="button" data-move="-1">▲ උඩට</button><button type="button" data-move="1">▼ පහළට</button>${it.img ? `<button type="button" data-nophoto>Photo අයින් කරන්න</button>` : ""}<button class="del" type="button" data-del>මකන්න</button></div>`}
    </div>` : ""}
  </article>`;
}
function render() {
  $("#chips").innerHTML = menu.cats.map(c => `<a href="#c-${esc(c.id)}">${esc(c.name)}</a>`).join("");
  $("#cats").innerHTML = menu.cats.map(c => `<section class="cat" id="c-${esc(c.id)}" data-cat="${esc(c.id)}">
    <div class="cat-h"><h2>${esc(c.name)}<span>${esc(c.si || "")}</span></h2><small style="color:var(--muted);font-weight:700">${c.items.length} items</small></div>
    ${c.items.map(cardHTML).join("")}
    <button class="add-item" type="button" data-add="${esc(c.id)}">+ අලුත් කෑමක් එකතු කරන්න</button>
  </section>`).join("");
}
function redraw(id) {
  const el = document.querySelector(`.card[data-id="${CSS.escape(id)}"]`), f = findItem(id);
  if (el && f) el.outerHTML = cardHTML(f.it);
}
function setState(msg, cls) {
  const st = $("#state");
  st.className = cls || (dirty ? "dirty" : "");
  st.textContent = msg || (dirty ? "Save කරලා නැති වෙනස්කම් තියෙනවා" : "වෙනස්කම් නෑ · website එකේ තියෙන්නේ මේ menu එකමයි");
  $("#save").disabled = !dirty;
}
const touch = () => { dirty++; setState(); };

/* ---- typing ---- */
$("#cats").addEventListener("input", e => {
  const card = e.target.closest(".card"), f = card && findItem(card.dataset.id), k = e.target.dataset.f;
  if (!f || !k) return;
  if (k === "p") { const v = e.target.value.replace(/[^0-9]/g, ""); if (v !== e.target.value) e.target.value = v; f.it.p = +v || 0; }
  else f.it[k] = e.target.value;
  if (k === "n" || k === "si") { const nm = card.querySelector(".nm"); nm.innerHTML = `<b class="${f.it.n.trim() ? "" : "empty"}">${f.it.n.trim() ? esc(f.it.n) : "නම දාන්න"}</b><span>${esc(f.it.si)}</span>`; }
  f.it._touched = true; touch();
});

/* ---- buttons ---- */
$("#cats").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  if (b.dataset.add) {
    const c = menu.cats.find(x => x.id === b.dataset.add);
    const it = { id: "i" + Date.now().toString(36), n: "", si: "", d: "", p: 0, tag: "", img: "", sold: false };
    c.items.unshift(it); open = it.id; sure = null; render(); touch();
    const card = document.querySelector(`.card[data-id="${it.id}"]`); card.scrollIntoView({ block: "center" }); card.querySelector('[data-f="n"]').focus();
    return;
  }
  const card = b.closest(".card"); if (!card) return;
  const id = card.dataset.id, f = findItem(id); if (!f) return;
  if (b.dataset.tog === "sold") { f.it.sold = !f.it.sold; redraw(id); touch(); }
  else if (b.dataset.tog === "tag") { f.it.tag = f.it.tag === "Popular" ? "" : "Popular"; redraw(id); touch(); }
  else if (b.hasAttribute("data-more")) { open = open === id ? null : id; sure = null; redraw(id); }
  else if (b.hasAttribute("data-move")) {
    const j = f.i + +b.dataset.move; if (j < 0 || j >= f.c.items.length) return;
    f.c.items.splice(f.i, 1); f.c.items.splice(j, 0, f.it); render(); touch();
    document.querySelector(`.card[data-id="${CSS.escape(id)}"]`).scrollIntoView({ block: "center" });
  }
  else if (b.hasAttribute("data-del")) { sure = id; redraw(id); }
  else if (b.hasAttribute("data-del-no")) { sure = null; redraw(id); }
  else if (b.hasAttribute("data-del-yes")) { f.c.items.splice(f.i, 1); sure = null; open = null; render(); touch(); }
  else if (b.hasAttribute("data-nophoto")) { f.it.img = ""; redraw(id); touch(); }
  else if (b.hasAttribute("data-photo")) { photoFor = id; $("#file").value = ""; $("#file").click(); }
});

/* ---- photos ---- */
$("#file").addEventListener("change", async () => {
  const file = $("#file").files[0], id = photoFor; if (!file || !id) return;
  const ph = document.querySelector(`.card[data-id="${CSS.escape(id)}"] .ph`); if (ph) ph.classList.add("busy");
  setState("Photo එක දානවා…", "dirty");
  try { const url = await RSMenu.photo(file, pin); const f = findItem(id); if (f) { f.it.img = url; redraw(id); touch(); } }
  catch (err) { setState("Photo එක දාන්න බැරි වුණා. වෙන photo එකක් බලන්න.", "bad"); if (ph) ph.classList.remove("busy"); }
});

/* ---- new section ---- */
$("#new-cat").addEventListener("submit", e => {
  e.preventDefault(); const name = $("#new-cat-name").value.trim(); if (!name) return;
  const c = { id: "c" + Date.now().toString(36), name, si: "", items: [] }; menu.cats.push(c); $("#new-cat-name").value = ""; render(); touch();
  document.getElementById("c-" + c.id).scrollIntoView({ block: "start" });
});

/* ---- save ---- */
$("#save").addEventListener("click", async () => {
  let first = null;
  menu.cats.forEach(c => c.items.forEach(it => { if (!it.n.trim() || !(it.p > 0)) { it._touched = true; if (!first) first = it; } }));
  if (first) { open = first.id; render(); document.querySelector(`.card[data-id="${CSS.escape(first.id)}"]`).scrollIntoView({ block: "center" }); setState("නම සහ ගාණ නැති කෑම තියෙනවා. රතු පාටින් පේන එක හදන්න.", "bad"); return; }
  const clean = JSON.parse(JSON.stringify(menu, (k, v) => k === "_touched" ? undefined : v));
  $("#save").disabled = true; setState("Save කරනවා…", "dirty");
  try { await RSMenu.save(clean, pin); dirty = 0; setState("Save කළා ✓ Website එකේ දැන් අලුත් menu එක පේනවා", "done"); }
  catch (err) { $("#save").disabled = false; setState(RSMenu.demo ? "Save කරන්න බැරි වුණා. Photos ගොඩක් නම් එකක් දෙකක් අයින් කරලා බලන්න." : "Save කරන්න බැරි වුණා. Internet එක බලලා ආයෙත් එබන්න.", "bad"); }
});
$("#reset").addEventListener("click", async () => { RSMenu.reset(); menu = await RSMenu.load(); dirty = 0; open = null; render(); setState("Demo menu එක මුල් විදියට ගත්තා", "done"); });
addEventListener("beforeunload", e => { if (dirty) { e.preventDefault(); e.returnValue = ""; } });
})();
</script>
</body>
</html>
